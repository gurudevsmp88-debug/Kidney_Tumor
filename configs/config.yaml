# Kidney tumor (normal vs tumor) classification pipeline configuration.
# Every path is relative to the working directory unless absolute.
# `data.root` can also be set with --data-root or the KIDNEY_DATA_ROOT env var.

seed: 42
device: auto            # auto | cpu | cuda

data:
  root: data            # holds train/ val/ test/ and *_labels.json
  hf_dataset: Alwaly/Kidney_Cancer-cancer   # source used by `prepare`
  image_size: 224
  slices_per_patient: 50  # pseudo patient grouping (no patient IDs in source)
  split: [0.70, 0.15, 0.15]
  batch_size: 32
  num_workers: 4
  class_names: [kidney_normal, kidney_tumor]

model:
  architecture: resnet18  # see src/models.py: AVAILABLE_MODELS
  pretrained: true
  num_classes: 2

train:
  epochs: 20
  lr: 1.0e-3
  weight_decay: 1.0e-4
  scheduler: cosine       # cosine | step
  step_size: 5
  gamma: 0.1
  patience: 5
  augmentation: robust    # standard (notebook 03) | robust (notebook 09)
  checkpoint_dir: checkpoints

evaluate:
  checkpoint: null        # defaults to <checkpoint_dir>/<architecture>_best.pth
  output_dir: results

uncertainty:
  mc_samples: 10

robustness:
  mc_samples: 10
  perturbations:
    noise:     {param: intensity, values: [0.05, 0.10, 0.20]}
    contrast:  {param: factor,    values: [0.7, 0.9, 1.1, 1.3]}
    blur:      {param: sigma,     values: [0.5, 1.0, 1.5]}
    rotate:    {param: angle,     values: [10, 25, 45]}
    translate: {param: shift,     values: [[0.1, 0.0], [0.0, 0.1]]}
